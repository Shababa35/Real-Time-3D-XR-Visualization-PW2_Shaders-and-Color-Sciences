<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Exercise 2: Peak Coordinate Tracker</title>
        <meta charset="utf-8">
        <style>
            body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
            #overlay {
                position: absolute; z-index: 10; top: 0; left: 0; width: 100%; height: 100%;
                display: flex; align-items: center; justify-content: center;
                background: rgba(0,0,0,0.8); color: white; cursor: pointer;
            }
            #video { display: none; }
            
          
            #info-panel {
                position: absolute; bottom: 20px; left: 20px;
                background: rgba(0, 0, 0, 0.7); color: #0f0;
                padding: 15px; border: 1px solid #0f0; border-radius: 5px;
                font-family: 'Courier New', Courier, monospace; pointer-events: none;
            }
            #peak-marker {
                color: #ff4444; font-weight: bold;
            }
        </style>
    </head>
    <body>

        <div id="overlay"><h1>Click to Start Tracking</h1></div>
        <div id="info-panel">
            <div>BRIGHTEST COORDINATE FOUND:</div>
            <div id="peak-marker">U: 0.00, V: 0.00</div>
            <div id="peak-val">VALUE: 0.00</div>
        </div>
        <video id="video" loop muted autoplay playsinline src="video.mp4"></video>

        <script type="x-shader/x-vertex" id="vertexshader">
            varying vec2 vUv;
            uniform float scaleElevation; 
            uniform sampler2D tex;
            void main() {
                vUv = uv; 
                vec4 texColor = texture2D(tex, vUv);
                float luminance = dot(texColor.rgb, vec3(0.299, 0.587, 0.114));
                vec3 newPosition = position;
                newPosition.z += luminance * scaleElevation;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        </script>

        <script type="x-shader/x-fragment" id="fragmentshader">
            varying vec2 vUv;
            uniform sampler2D tex;
            void main() {
                gl_FragColor = texture2D(tex, vUv);
            }
        </script>

        <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
        <script type="importmap">
          {
            "imports": {
              "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
              "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
          }
        </script>

        <script type="module">
            import * as THREE from 'three';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

            let camera, scene, renderer, controls, mesh;
            const video = document.getElementById('video');
            const overlay = document.getElementById('overlay');
            const peakText = document.getElementById('peak-marker');
            const valText = document.getElementById('peak-val');

            
            const analysisCanvas = document.createElement('canvas');
            const analysisCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });

            overlay.addEventListener('click', () => {
                overlay.style.display = 'none';
                video.play();
                init();
                animate();
            });

            function updatePeakInfo() {
                if (video.readyState < 2) return;

                
                const size = 32;
                analysisCanvas.width = size;
                analysisCanvas.height = size;
                analysisCtx.drawImage(video, 0, 0, size, size);
                
                const pixels = analysisCtx.getImageData(0, 0, size, size).data;
                let maxLum = -1;
                let brightestIdx = 0;

                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i] / 255;
                    const g = pixels[i+1] / 255;
                    const b = pixels[i+2] / 255;
                    const lum = r * 0.299 + g * 0.587 + b * 0.114;

                    if (lum > maxLum) {
                        maxLum = lum;
                        brightestIdx = i / 4;
                    }
                }

                const u = (brightestIdx % size) / size;
                const v = 1.0 - (Math.floor(brightestIdx / size) / size);

                peakText.innerText = `U: ${u.toFixed(2)}, V: ${v.toFixed(2)}`;
                valText.innerText = `VALUE: ${maxLum.toFixed(2)}`;
            }

            function init() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(4, 4, 4);
                camera.up.set(0, 0, 1);

                const videoTexture = new THREE.VideoTexture(video);
                const aspect = video.videoHeight / video.videoWidth || 0.75;
                const geometry = new THREE.PlaneGeometry(6, 6 * aspect, 128, 128);
                
                const material = new THREE.ShaderMaterial({
                    vertexShader: document.getElementById('vertexshader').textContent,
                    fragmentShader: document.getElementById('fragmentshader').textContent,
                    uniforms: {
                        scaleElevation: { value: 2.0 },
                        tex: { value: videoTexture }
                    },
                    side: THREE.DoubleSide
                });

                mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                controls = new OrbitControls(camera, renderer.domElement);
                window.addEventListener('resize', onWindowResize);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function animate() {
                requestAnimationFrame(animate);
                updatePeakInfo();
                if (controls) controls.update();
                renderer.render(scene, camera);
            }
        </script>
    </body>
</html>
