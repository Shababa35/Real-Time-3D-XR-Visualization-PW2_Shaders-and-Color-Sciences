<!DOCTYPE html>
<html lang="en">
    <head>
        <title>XR Elevation Map - Simplified Controls</title>
        <meta charset="utf-8">
        <style>
            body { margin: 0; background-color: #000; overflow: hidden; }
            #ui-panel {
                width: 320px;
                padding: 25px;
                background-color: rgba(240, 240, 240, 0.95);
                border-radius: 15px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
            .slider-label { display: block; margin-top: 15px; font-weight: bold; color: #333; }
            input[type="range"] { width: 100%; cursor: pointer; }
            h2 { margin: 0; color: #000; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
            #overlay {
                position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                display: flex; align-items: center; justify-content: center;
                background: rgba(0,0,0,0.9); color: white; z-index: 1000; cursor: pointer;
            }
        </style>
    </head>
    <body>

        <div id="overlay"><h1>Click to Start XR Session</h1></div>

        <div id="ui-panel">
            <h2>XR Controls</h2>
            <label class="slider-label">Elevation Intensity</label>
            <input type="range" id="elevation-slider" min="0" max="5" step="0.1" value="1.8">
            
            <label class="slider-label">Ambient Brightness</label>
            <input type="range" id="ambient-slider" min="0" max="0.8" step="0.01" value="0.15">
        </div>

        <video id="video" loop muted autoplay playsinline src="video.mp4" style="display:none"></video>

        <script type="x-shader/x-vertex" id="vertexshader">
            varying vec2 vUv;
            varying vec3 vNormal;
            uniform float scaleElevation; 
            uniform sampler2D tex;
            uniform vec2 texelSize; 

            float getLum(vec2 uvCoord) {
                vec4 texColor = texture2D(tex, uvCoord);
                return dot(texColor.rgb, vec3(0.299, 0.587, 0.114));
            }

            void main() {
                vUv = uv;
                float h = getLum(vUv);
                float hR = getLum(vUv + vec2(texelSize.x, 0.0));
                float hL = getLum(vUv + vec2(-texelSize.x, 0.0));
                float hU = getLum(vUv + vec2(0.0, texelSize.y));
                float hD = getLum(vUv + vec2(0.0, -texelSize.y));

                float dh_du = (hR - hL) * scaleElevation;
                float dh_dv = (hU - hD) * scaleElevation;
                
                vNormal = normalize(vec3(-dh_du, -dh_dv, 1.0));
                
                vec3 pos = position;
                pos.z += h * scaleElevation;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        </script>

        <script type="x-shader/x-fragment" id="fragmentshader">
            varying vec2 vUv;
            varying vec3 vNormal;
            uniform sampler2D tex;
            uniform vec3 L;
            uniform float ka;

            void main() {
                vec3 rgb = texture2D(tex, vUv).rgb;
                vec3 N = normalize(vNormal);
                float diff = max(dot(N, normalize(L)), 0.0); 
                gl_FragColor = vec4(rgb * (ka + diff), 1.0);
            }
        </script>

        <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
        <script type="importmap">
          {
            "imports": {
              "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
              "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
          }
        </script>

        <script type="module">
            import * as THREE from 'three';
            import { VRButton } from 'three/addons/webxr/VRButton.js';
            import { HTMLMesh } from 'three/addons/interactive/HTMLMesh.js';
            import { InteractiveGroup } from 'three/addons/interactive/InteractiveGroup.js';
            import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

            let camera, scene, renderer, mesh, uiMesh;
            const video = document.getElementById('video');
            const overlay = document.getElementById('overlay');

            overlay.addEventListener('click', () => {
                overlay.style.display = 'none';
                video.play();
                init();
            });

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0a0a);

                camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.xr.enabled = true;
                document.body.appendChild(renderer.domElement);
                document.body.appendChild(VRButton.createButton(renderer));

                const group = new InteractiveGroup(renderer, camera);
                scene.add(group);

                const controllerModelFactory = new XRControllerModelFactory();
                
                for (let i = 0; i < 2; i++) {
                    const controller = renderer.xr.getController(i);
                    const lineGeom = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, 0, 0), 
                        new THREE.Vector3(0, 0, -5)
                    ]);
                    const line = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color: 0xffffff }));
                    controller.add(line);
                    group.add(controller);

                    const grip = renderer.xr.getControllerGrip(i);
                    grip.add(controllerModelFactory.createControllerModel(grip));
                    scene.add(grip);
                }

                const videoTexture = new THREE.VideoTexture(video);
                const res = 128;
                const geometry = new THREE.PlaneGeometry(4, 3, res, res);
                const material = new THREE.ShaderMaterial({
                    vertexShader: document.getElementById('vertexshader').textContent,
                    fragmentShader: document.getElementById('fragmentshader').textContent,
                    uniforms: {
                        tex: { value: videoTexture },
                        scaleElevation: { value: 1.8 },
                        texelSize: { value: new THREE.Vector2(1/res, 1/res) },
                        L: { value: new THREE.Vector3(1, 1, 1) }, // Default fixed light position
                        ka: { value: 0.15 }
                    }
                });

                mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(0, -1.1, -4.0); 
                mesh.rotation.x = -Math.PI / 2.5;
                scene.add(mesh);

                const uiPanel = document.getElementById('ui-panel');
                uiMesh = new HTMLMesh(uiPanel);
                uiMesh.position.set(2.2, 1.5, -2.5); 
                uiMesh.rotation.y = -Math.PI / 4; 
                uiMesh.scale.setScalar(3); 
                group.add(uiMesh);

                renderer.setAnimationLoop(render);
            }

            function render() {
                if (mesh) {
                    const elevation = document.getElementById('elevation-slider').value;
                    const ambient = document.getElementById('ambient-slider').value;

                    mesh.material.uniforms.scaleElevation.value = parseFloat(elevation);
                    mesh.material.uniforms.ka.value = parseFloat(ambient);
                    // Light position (L) is no longer being updated from the UI
                }
                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        </script>
    </body>
</html>
