<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Exercise 3: Human-Perceived Lambertian Lighting</title>
        <meta charset="utf-8">
        <style>
            body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
            #overlay {
                position: absolute; z-index: 10; top: 0; left: 0; width: 100%; height: 100%;
                display: flex; align-items: center; justify-content: center;
                background: rgba(0,0,0,0.9); color: white; cursor: pointer;
            }
        </style>
    </head>
    <body>

        <div id="overlay"><h1>Click to Start</h1></div>
        <video id="video" loop muted autoplay playsinline src="video.mp4" style="display:none"></video>

        <script type="x-shader/x-vertex" id="vertexshader">
            varying vec2 vUv;
            varying vec3 vNormal;

            uniform float scaleElevation; 
            uniform sampler2D tex;
            uniform vec2 texelSize; 

            // Helper function for human-perceived brightness
            float getLum(vec4 color) {
                return dot(color.rgb, vec3(0.299, 0.587, 0.114));
            }

            void main() {
                vUv = uv;
                
                // 1. Get perceived height at current pixel
                float h = getLum(texture2D(tex, vUv));
                
                // 2. FINITE DIFFERENCES using Luminance
                float h_right = getLum(texture2D(tex, vUv + vec2(texelSize.x, 0.0)));
                float h_left  = getLum(texture2D(tex, vUv + vec2(-texelSize.x, 0.0)));
                float h_up    = getLum(texture2D(tex, vUv + vec2(0.0, texelSize.y)));
                float h_down  = getLum(texture2D(tex, vUv + vec2(0.0, -texelSize.y)));

                float dh_du = (h_right - h_left) * scaleElevation;
                float dh_dv = (h_up - h_down) * scaleElevation;

                // 3. Compute the Unit Surface Normal (N)
                vNormal = normalize(vec3(-dh_du, -dh_dv, 1.0));
                
                vec3 newPosition = position;
                newPosition.z += h * scaleElevation;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
            }
        </script>

        <script type="x-shader/x-fragment" id="fragmentshader">
            varying vec2 vUv;
            varying vec3 vNormal;
            
            uniform sampler2D tex;
            uniform vec3 L;  
            uniform vec3 Id; 
            uniform float kd; 
            uniform float ka; 

            void main() {
                vec3 baseColor = texture2D(tex, vUv).rgb;
                vec3 N = normalize(vNormal);

                // LAMBERTIAN MODEL
                float diffuse = max(dot(N, normalize(L)), 0.0);
                vec3 lighting = (ka + Id * kd * diffuse);
                
                gl_FragColor = vec4(baseColor * lighting, 1.0);
            }
        </script>

        <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
        <script type="importmap">
          {
            "imports": {
              "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
              "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
          }
        </script>

        <script type="module">
            import * as THREE from 'three';
            import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

            let camera, scene, renderer, controls, material;
            const video = document.getElementById('video');
            const overlay = document.getElementById('overlay');

            overlay.addEventListener('click', () => {
                overlay.style.display = 'none';
                video.play();
                init();
                animate();
            });

            function init() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(5, -5, 5);
                camera.up.set(0, 0, 1);

                const videoTexture = new THREE.VideoTexture(video);
                const res = 256; 
                const geometry = new THREE.PlaneGeometry(8, 6, res, res);
                
                material = new THREE.ShaderMaterial({
                    vertexShader: document.getElementById('vertexshader').textContent,
                    fragmentShader: document.getElementById('fragmentshader').textContent,
                    uniforms: {
                        tex: { value: videoTexture },
                        scaleElevation: { value: 2.0 }, // Bumped slightly for effect
                        texelSize: { value: new THREE.Vector2(1/res, 1/res) },
                        L: { value: new THREE.Vector3(1.0, 1.0, 1.0) },
                        Id: { value: new THREE.Vector3(1.0, 1.0, 1.0) },
                        kd: { value: 0.8 },
                        ka: { value: 0.15 }
                    }
                });

                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                controls = new OrbitControls(camera, renderer.domElement);
            }

            function animate() {
                requestAnimationFrame(animate);
                if (material) {
                    const time = performance.now() * 0.001;
                    material.uniforms.L.value.x = Math.sin(time) * 2.0;
                    material.uniforms.L.value.y = Math.cos(time) * 2.0;
                }
                if(controls) controls.update();
                renderer.render(scene, camera);
            }
        </script>
    </body>
</html>
